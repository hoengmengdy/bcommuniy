services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bcommunity}
      POSTGRES_USER: ${POSTGRES_USER:-bcommunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bcommunity}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bcommunity}
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      TRUST_PROXY: "0"
      HOST: 0.0.0.0
      PORT: "8080"
      TOKEN_MAX_AGE: ${TOKEN_MAX_AGE:-86400}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
