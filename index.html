<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Bcommunity – connect, learn, and share with your community.">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#6d28d9">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bcommunity">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Bcommunity</title>
    <script>
      // Apply the saved theme and language before the first paint (no white flash in dark mode).
      try {
        var theme = localStorage.getItem('bcommunity-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.lang = localStorage.getItem('bcommunity-lang') || 'km'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
